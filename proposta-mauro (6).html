<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proposta | Alpha Zero Studio’s</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&amp;family=Unbounded:wght@300;500&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--mut:#8c8c8c;--ln:#2b2b2b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.55 'DM Sans',system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 20px 150px}
.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--ln);font-size:14px;color:var(--mut)}
.logo{font:500 14px Unbounded,sans-serif;color:var(--fg);border:1px solid var(--fg);padding:6px 9px}
.mut{color:var(--mut);margin:0}
h1{font:300 clamp(30px,9vw,52px)/1.12 Unbounded,sans-serif;margin:8px 0 14px}
.hero{padding:40px 0 32px}
.big{font:300 clamp(46px,14vw,104px)/1.05 Unbounded,sans-serif;color:transparent;-webkit-text-stroke:1px var(--fg);margin:28px 0 6px}
section{padding:34px 0;border-top:1px solid var(--ln)}
h2{font:500 14px Unbounded,sans-serif;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 18px}
.r{padding:14px 0;border-bottom:1px solid var(--ln)}
.rt{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rt>div:first-child,.rt>span:first-child{flex:1;min-width:0}
.d{color:var(--mut);font-size:14px;margin-top:2px}
.pr{font:500 15px Unbounded,sans-serif;white-space:nowrap}
.bar{height:2px;background:var(--ln);margin-top:10px}
.bar i{display:block;height:100%;background:var(--fg)}
.pct{font:300 clamp(64px,20vw,120px)/1.05 Unbounded,sans-serif;color:transparent;-webkit-text-stroke:1px var(--fg);margin:0 0 10px}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.cnt b{display:block;font:300 36px/1.1 Unbounded,sans-serif}
.cnt span{color:var(--mut);font-size:14px}
.chip{border:1px solid var(--mut);color:var(--mut);background:none;border-radius:99px;padding:3px 14px;font:500 13px 'DM Sans',sans-serif;white-space:nowrap}
.chip.aprovado{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.reprovado{color:var(--fg);border:1px dashed var(--fg)}
.chk{flex:none;width:28px;height:28px;border:1px solid var(--fg);border-radius:6px;background:none;color:var(--bg);font-size:16px;line-height:1}
.chk[aria-pressed=true]{background:var(--fg)}
button{cursor:pointer}
input,textarea{background:#0e0e0e;border:1px solid #444;color:var(--fg);font:inherit;padding:8px 10px;border-radius:6px;width:100%;min-width:0;margin:2px 0}
input[type=number]{width:96px}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
.st{width:52px;height:52px;font-size:26px;color:var(--fg);border-color:var(--fg)}
.st:disabled{opacity:.3;cursor:default}
input[type=range]{padding:0;accent-color:#fff;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.x{background:none;border:1px solid #444;color:var(--mut);border-radius:6px;width:32px;height:32px;font-size:18px;line-height:1;flex:none}
.ad{margin-top:14px;background:none;border:1px dashed var(--mut);color:var(--fg);border-radius:6px;padding:8px 14px;font:inherit}
.own{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.own button{border:1px solid var(--fg);background:none;color:var(--fg);border-radius:99px;padding:8px 16px;font:500 14px 'DM Sans',sans-serif}
.own #pub{background:var(--fg);color:var(--bg)}
#msg{font-size:13px;color:var(--mut);margin:0}
#tot{position:fixed;left:0;right:0;bottom:0;background:#0a0a0a;border-top:1px solid var(--fg);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;justify-content:space-between;align-items:center}
#tot small{display:block;color:var(--mut);font-size:13px}
#tot b{font:500 clamp(18px,5.5vw,26px) Unbounded,sans-serif}
.cta{background:var(--fg);color:var(--bg);border-radius:99px;padding:11px 20px;font:500 15px 'DM Sans',sans-serif;text-decoration:none;white-space:nowrap}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;padding:0}
.foot{padding-top:28px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="logo">AO</span><span>Alpha Zero Studio’s</span></div>
  <div class="own" id="own" hidden="">
    <button id="ed">Editar proposta</button>
    <button id="pub" hidden="">Baixar proposta (HTML)</button>
    <button id="out">Sair do administrador</button>
    <p id="msg"></p>
  </div>
  <div id="app"></div>
  <p class="foot">Proposta personalizada, válida para o cliente indicado acima. Atualizada pela Alpha Zero Studio’s a cada etapa.</p>
  <p class="foot"><button class="lnk" id="adm">Área do administrador</button></p>
</div>
<div id="tot"></div>
<script type="application/json" id="st">{"cliente":"Mauro ","pacote":"Pacote Presença Digital","intro":"Um pacote montado para a sua marca, da captação à entrega final.","base":2000,"vmin":10,"vq":10,"pva":150,"ve":3,"zap":"","upd":"17/11/2026","inclui":[{"n":"Vídeos editados","d":"Quantidade mínima do pacote, que você pode aumentar abaixo."},{"n":"Captação de vídeo e foto","d":"Diária de gravação com equipamento profissional."},{"n":"Edição e coloração","d":"Edição completa com correção de cor cinematográfica."},{"n":"Estruturação do perfil no Instagram","d":"Identidade, bio e organização do feed."},{"n":"1 rodada de ajustes por material","d":"Você pede os ajustes e a gente refaz."}],"extras":[{"n":"Drone","d":"Imagens aéreas na captação.","v":400,"on":false,"pv":false},{"n":"Edição premium","d":"Coloração avançada e acabamento extra em cada vídeo.","v":80,"on":false,"pv":true},{"n":"20 fotos extras","d":"Tratamento e entrega em alta resolução.","v":250,"on":false,"pv":false}],"etapas":[{"n":"Captação","p":100},{"n":"Edição","p":40},{"n":"Coloração","p":15},{"n":"Entrega final","p":0}],"itens":[{"n":"Vídeo 01, apresentação","s":"aprovado","nota":""},{"n":"Vídeo 02, bastidores","s":"aprovado","nota":""},{"n":"Vídeo 03, depoimento","s":"aprovado","nota":"Ajustar a cor da pele e o corte inicial."}],"id":"p1794899193389"}</script>
<script>
const S=JSON.parse(document.getElementById('st').textContent);
const K='ao-prop-'+(S.id||'modelo');
try{const d0=localStorage.getItem(K);if(d0)Object.assign(S,JSON.parse(d0));}catch(x){}
const h=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677);}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return 4294967296*(2097151&b)+(a>>>0)};
const nz=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'').replace(/^alpha/,'alfa');
const HASH=1996034433135152;
let edit=false,adm=false;
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>'R$ '+Number(v||0).toLocaleString('pt-BR');
const ST={analise:'Em análise',aprovado:'Aprovado',reprovado:'Reprovado'},NX={analise:'aprovado',aprovado:'reprovado',reprovado:'analise'};
const bar=v=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div>`;
const f=(k,v,t='text',x='')=>edit?`<input data-k="${k}" type="${t}" value="${e(v)}" ${x}>`:e(v);
const del=k=>edit?`<button class="x" data-del="${k}" aria-label="Remover">×</button>`:'';
const total=()=>S.base+Math.max(0,S.vq-S.vmin)*S.pva+S.extras.filter(x=>x.on).reduce((a,x)=>a+(x.pv?x.v*S.vq:x.v),0);
function R(){
  if(adm)try{localStorage.setItem(K,JSON.stringify(S));}catch(x){}
  const p=Math.round(S.etapas.reduce((a,x)=>a+x.p,0)/(S.etapas.length||1));
  const c=k=>S.itens.filter(i=>i.s===k).length;
  $('#app').innerHTML=`
  <div class="hero"><p class="mut">Proposta personalizada para</p><h1>${f('cliente',S.cliente)}</h1><p>${f('pacote',S.pacote)}</p><p class="mut">${f('intro',S.intro)}</p>
  <div class="big">${edit?f('base',S.base,'number','data-n min=2000'):brl(S.base)}</div><p class="mut">${S.vmin} vídeos inclusos. Valor mínimo do pacote.</p></div>
  <section><h2>O que está incluso</h2><p class="sub">Tudo isso já faz parte do seu pacote.</p>
  ${S.inclui.map((x,i)=>`<div class="r"><div class="rt"><div>${f(`inclui.${i}.n`,x.n)}<div class="d">${f(`inclui.${i}.d`,x.d)}</div></div>${del('inclui.'+i)}</div></div>`).join('')}
  ${edit?'<button class="ad" data-add="inclui">Adicionar item incluso</button>':''}</section>
  <section><h2>Quantos vídeos você quer?</h2><p class="sub">O pacote inclui ${S.vmin} vídeos. Cada vídeo adicional custa ${brl(S.pva)}.</p><div class="rt"><button class="x st" data-vq="-1" aria-label="Menos um vídeo" ${S.vq<=S.vmin?'disabled':''}>−</button><div class="pct" style="margin:0;text-align:center">${S.vq}</div><button class="x st" data-vq="1" aria-label="Mais um vídeo">+</button></div></section>
  <section><h2>Adicione o que o seu projeto pede</h2><p class="sub">Marque os extras e veja o valor final no rodapé.</p>
  ${S.extras.map((x,i)=>`<div class="r"><div class="rt"><button class="chk" data-ex="${i}" role="checkbox" aria-checked="${x.on}" aria-pressed="${x.on}" aria-label="Incluir ${e(x.n)}">${x.on?'✓':''}</button><div>${f(`extras.${i}.n`,x.n)}<div class="d">${f(`extras.${i}.d`,x.d)}</div></div>${edit?f(`extras.${i}.v`,x.v,'number','data-n min=0')+`<label class="d"><input type="checkbox" data-k="extras.${i}.pv" ${x.pv?'checked':''}>por vídeo</label>`:`<span class="pr">+ ${brl(x.v)}${x.pv?' por vídeo':''}</span>`}${del('extras.'+i)}</div></div>`).join('')}
  ${edit?'<button class="ad" data-add="extras">Adicionar extra</button>':''}</section>
  <section><h2>Andamento do projeto</h2><p class="sub">Acompanhe cada etapa junto com a gente.</p>
  <div class="pct" aria-label="${p}% concluído">${p}%</div>
  <div class="r"><div class="rt"><span>Vídeos entregues</span><span>${edit?f('ve',S.ve,'number','data-n min=0'):S.ve} de ${S.vq}</span></div>${bar(S.ve/(S.vq||1)*100)}</div>
  ${S.etapas.map((x,i)=>`<div class="r"><div class="rt"><span>${f(`etapas.${i}.n`,x.n)}</span><span class="rt">${edit?f(`etapas.${i}.p`,x.p,'range','data-n min=0 max=100 step=5')+x.p+'%':x.p+'%'}${del('etapas.'+i)}</span></div>${bar(x.p)}</div>`).join('')}
  ${edit?'<button class="ad" data-add="etapas">Adicionar etapa</button>':''}</section>
  ${edit?`<section><h2>Valores do pacote</h2><p class="d">Vídeos inclusos (mínimo 10)</p>${f('vmin',S.vmin,'number','data-n min=10')}<p class="d">Preço de cada vídeo adicional (R$)</p>${f('pva',S.pva,'number','data-n min=0')}</section><section><h2>WhatsApp para fechar</h2><p class="sub">Só números, com DDD. Ex.: 51999999999</p>${f('zap',S.zap,'text','inputmode="numeric"')}</section>`:''}`;
  const ex=S.extras.filter(x=>x.on).map(x=>x.n).join(', ');
  const msg=`Olá! Quero fechar a proposta de ${S.cliente}: ${S.vq} vídeos.${ex?' Extras: '+ex+'.':''} Total: ${brl(total())}.`;
  const z=String(S.zap||'').replace(/\D/g,'');
  $('#tot').innerHTML=`<div><small>Seu investimento, ${S.vq} vídeos</small><b>${brl(total())}</b></div>${z?`<a class="cta" href="https://wa.me/${z}?text=${encodeURIComponent(msg)}">Quero fechar</a>`:''}`;
}
$('#app').addEventListener('change',ev=>{
  const t=ev.target.closest('[data-k]');if(!t)return;
  const k=t.dataset.k.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];
  const l=k[k.length-1];
  o[l]=t.type==='checkbox'?t.checked:'n'in t.dataset?Math.max(+t.min||0,Number(t.value)||0):t.value;
  if(S.vq<S.vmin)S.vq=S.vmin;
  if(k[0]==='etapas'&&l==='p')o[l]=Math.min(100,o[l]);
  R();
});
$('#app').addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.vq){S.vq=Math.max(S.vmin,S.vq+Number(d.vq));}
  else if(d.ex){const x=S.extras[d.ex];x.on=!x.on;}
  else if(d.st){const i=S.itens[d.st];i.s=NX[i.s];}
  else if(d.del){const [a,i]=d.del.split('.');S[a].splice(i,1);}
  else if(d.add){const a=d.add;S[a].push(a==='inclui'?{n:'Novo item',d:'Descrição'}:a==='extras'?{n:'Novo extra',d:'Descrição',v:100,on:false,pv:false}:a==='etapas'?{n:'Nova etapa',p:0}:{n:'Novo material',s:'analise',nota:''});}
  else return;
  R();
});
$('#ed').onclick=()=>{edit=!edit;$('#ed').textContent=edit?'Concluir edição':'Editar proposta';$('#pub').hidden=!edit;R();};
$('#pub').onclick=()=>{
  const T=Object.assign({},S,{id:'p'+Date.now(),upd:new Date().toLocaleDateString('pt-BR')});
  const d=document.documentElement.cloneNode(true);
  d.querySelector('#app').innerHTML='';d.querySelector('#tot').innerHTML='';
  d.querySelector('#st').textContent=JSON.stringify(T).replace(/</g,'\\u003c');
  d.querySelector('#own').hidden=true;d.querySelector('#pub').hidden=true;d.querySelector('#adm').hidden=false;
  d.querySelector('#ed').textContent='Editar proposta';d.querySelector('#msg').textContent='';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['<!doctype html>\n'+d.outerHTML],{type:'text/html'}));
  a.download='proposta-'+(nz(S.cliente)||'cliente')+'.html';
  document.body.appendChild(a);a.click();a.remove();
  $('#msg').textContent='Arquivo baixado. Envie para o cliente.';
};
$('#adm').onclick=()=>{
  const p=prompt('Senha do administrador');if(p===null)return;
  if(h(nz(p))===HASH){adm=true;$('#own').hidden=false;$('#adm').hidden=true;R();}else alert('Senha incorreta.');
};
$('#out').onclick=()=>{adm=false;edit=false;$('#ed').textContent='Editar proposta';$('#pub').hidden=true;$('#own').hidden=true;$('#adm').hidden=false;R();};
R();
</script>


</body></html>
